name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # Real Postgres + Redis rather than mocks: the whole point of 2.0 is that
    # the database enforces the rules (foreign keys, enums, CHECK constraints),
    # so CI has to actually apply the migrations to prove they work.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codeearly
          POSTGRES_PASSWORD: codeearly
          POSTGRES_DB: codeearly_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U codeearly"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://codeearly:codeearly@localhost:5432/codeearly_test?schema=public
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-secret-not-used-for-anything-real
      BETTER_AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      # Not a real key. The webhook signature scheme is HMAC of the raw body,
      # so valid signatures can be produced locally — which is what lets CI
      # verify the money-protecting properties without contacting Paystack.
      PAYSTACK_SECRET_KEY: sk_test_ci_placeholder_not_a_real_key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed (must be idempotent — runs on every deploy)
        run: npm run db:seed

      - name: Invoice numbering stays gapless
        run: npx tsx scripts/check-invoice-numbering.ts

      - name: Programs cannot be oversold
        run: npx tsx scripts/check-program-capacity.ts

      # Drives a whole quiz through the state machine. No socket involved: this
      # asserts the AUTHORITY, and clients can only ask the server to do these
      # things, so if the rules hold here they hold for every client.
      - name: Quiz engine rules hold
        run: npx tsx scripts/check-quiz-engine.ts

      # The dangerous LMS failures are not crashes: a child losing progress,
      # seeing a draft, or a completion timestamp that disagrees with what a
      # report card later prints.
      - name: LMS progress and access rules hold
        run: npx tsx scripts/check-lms.ts

      # Report cards and certificates are documents a parent keeps and may hand
      # to a school. The failures that matter are silent: a published report
      # changing its figures, a duplicate certificate, or a withdrawn one that
      # verifies as if nothing happened.
      - name: Learner records stay truthful
        run: npx tsx scripts/check-records.ts

      # The showcase is a public page about a child, so the consent rule is
      # asserted twice — once in the service and once by going round it and
      # writing to the database directly. Also covers event overselling under
      # simultaneous bookings, and the promise that an unsubscribed address
      # cannot come back.
      - name: Content surfaces behave
        run: npx tsx scripts/check-content.ts

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Runs against the built server, so it exercises the real route handler
      # rather than a mock. These assertions are what stand between us and
      # double-charging a parent or accepting a forged payment notification.
      - name: Payment webhook contract
        run: |
          npm run start &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/api/health > /dev/null && break
            sleep 2
          done
          npx tsx scripts/check-paystack-webhook.ts

      # Separate from the webhook contract because it asserts a different thing:
      # not "was the payment recorded correctly" but "did the family actually
      # GET what they paid for". That gap shipped once and every signal —
      # invoice PAID, receipt sent, ledger balanced — said it had worked.
      - name: Payment grants access
        run: npx tsx scripts/check-fulfilment.ts

      # Over HTTP, against the built server, because the thing under test IS the
      # cookie and redirect behaviour — a service-level test cannot see a
      # Set-Cookie header. A child on the family laptop once had both sessions
      # at once and could walk into billing; this makes that unshippable.
      - name: Audiences stay separated
        run: npx tsx scripts/check-session-isolation.ts
