name: iOS build

# Deliberately NOT on every push. GitHub bills macOS runner minutes at 10x the
# Linux rate on private repos, and an iOS build takes minutes — running it on
# every commit would quietly become the most expensive thing in this repo.
# Tags produce a build; anything else is manual.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: "Upload to TestFlight after building"
        type: boolean
        default: false

jobs:
  build:
    # The whole point of this workflow: a macOS machine we do not own.
    runs-on: macos-latest
    timeout-minutes: 45

    env:
      # The shell loads the hosted portal, so the build needs to know which one.
      CE_APP_URL: ${{ vars.CE_APP_URL || 'https://www.codeearly.com' }}
      # The `secrets` context is NOT available in `if:` conditions — only in
      # env, with and run. So presence is resolved here, once, into plain
      # strings the conditions below can read.
      HAS_SIGNING: ${{ secrets.IOS_P12_BASE64 != '' }}
      HAS_APPSTORE_KEY: ${{ secrets.APPSTORE_API_KEY_ID != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `cap sync` runs the project's tooling, which resolves @prisma/client.
      # Without a generated client the TypeScript config fails to load.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Add iOS platform if missing
        run: |
          if [ ! -d "ios" ]; then npx cap add ios; fi

      - name: Sync Capacitor config and plugins
        run: npx cap sync ios

      # NOTE: no CocoaPods step. Capacitor 8 resolves plugins through Swift
      # Package Manager (ios/App/CapApp-SPM/Package.swift) and xcodebuild
      # fetches them itself. There is no Podfile and no .xcworkspace, so every
      # xcodebuild call below targets App.xcodeproj directly.

      # ── Signing ────────────────────────────────────────────────────────────
      # Skipped entirely when secrets are absent, so this workflow still proves
      # the project COMPILES before an Apple Developer account exists. Without
      # that guard the first run would fail on signing and tell us nothing about
      # whether the code is sound.
      - name: Import signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN=build.keychain
          security create-keychain -p "" $KEYCHAIN
          security set-keychain-settings -lut 21600 $KEYCHAIN
          security unlock-keychain -p "" $KEYCHAIN
          security default-keychain -s $KEYCHAIN

          echo "$P12_BASE64" | base64 --decode > cert.p12
          security import cert.p12 -k $KEYCHAIN -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" $KEYCHAIN

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

          rm cert.p12

      - name: Build unsigned (verifies it compiles)
        if: env.HAS_SIGNING != 'true'
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      - name: Archive and export IPA
        if: env.HAS_SIGNING == 'true'
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App \
            -configuration Release -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            archive

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload IPA artifact
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: codeearly-ios
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14

      - name: Upload to TestFlight
        if: env.HAS_APPSTORE_KEY == 'true' && (github.event_name == 'push' || inputs.upload_testflight)
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo "$API_KEY_BASE64" | base64 --decode \
            > ~/private_keys/AuthKey_$API_KEY_ID.p8
          xcrun altool --upload-app -f "$RUNNER_TEMP"/export/*.ipa -t ios \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
          rm -rf ~/private_keys
