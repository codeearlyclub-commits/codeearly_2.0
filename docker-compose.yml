# CodeEarly 2.0 — full stack in one command: docker compose up -d
# Services: caddy (TLS/proxy) → app (Next.js) + worker (BullMQ) → postgres + redis

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Exposed to host for local Prisma Studio / psql; drop in prod if not needed.
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Host port 6380 — 6379 is taken by another project's Redis on this machine.
    # Containers still reach it in-network on 6379 (see app/worker REDIS_URL).
    ports:
      - "6380:6379"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # REQUIRED. Without an explicit target, compose builds the LAST stage in
      # the Dockerfile — which is `worker` — so the app silently ran the worker
      # image and failed with "Could not find a production build in '.next'".
      target: runner
    restart: unless-stopped
    env_file: .env
    environment:
      # Ensure the app talks to compose services, not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      # .env carries NODE_ENV=development for host tooling; a container serving
      # a production build must not inherit it.
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Runs migrations then starts Next.js. Safe to re-run (deploy is idempotent).
    command: ["sh", "-c", "npx prisma migrate deploy && npm run start"]
    expose:
      - "3000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node_modules/.bin/tsx", "src/jobs/worker.ts"]

  # Socket.io lives in its own process: Next route handlers have nowhere to keep
  # a long-lived socket, and a quiz with 200 children in it must not starve the
  # web app of event-loop time. The Redis adapter shares rooms between
  # instances, so scaling out joins the same quiz rather than hosting a rival one.
  realtime:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      REALTIME_PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node_modules/.bin/tsx", "src/realtime/server.ts"]
    expose:
      - "3001"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
