<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CodeEarly Club">
  <!-- No rounded corners: iOS applies its own mask, and a pre-rounded icon
       ends up with a visible double-corner. -->
  <rect width="64" height="64" fill="#0d1b3e"/>
  <polyline points="43,17 21,17 33,32 21,47 43,47"
            fill="none" stroke="#00c896" stroke-width="7"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
